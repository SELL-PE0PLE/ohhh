<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ohhh</title>
    <!-- Новая версия для полного сброса кэша стилей -->
    <link rel="stylesheet" href="style.css?v=1115">
</head>
<body>

    <!-- ЭКРАН КАПЧИ -->
    <div id="captcha-screen">
        <div class="ohhh-captcha-container">
            <div class="captcha-main-row">
                <div class="checkbox-container" id="loader-wrapper">
                    <!-- Кастомный блок капчи -->
                    <div id="captcha-check" class="captcha-checkbox-mock"></div>
                    <div class="captcha-loader"></div>
                </div>
                <span class="captcha-text">I am tired</span>
            </div>
            
            <div class="captcha-bottom-bar">
                <div class="brand-left">
                    <svg class="brand-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    </svg>
                    <span class="brand-name">OhhhCaptcha</span>
                </div>
                <div class="brand-rules">Terms & Privacy</div>
            </div>
        </div>
    </div>

    <!-- ОСНОВНОЙ САЙТ -->
    <div id="main-site">
        <header class="solid-header">
            <div class="logo">Ohhh</div>
        </header>

        <div class="main-container">
            <div class="welcome-glass-panel">
                <h1>Welcome.</h1>
                <p>Check it out. Or no.</p>
            </div>
        </div>
    </div>

    <div style="width: 1px; height: 1px; opacity: 0; overflow: hidden; position: absolute; pointer-events: none;">
      <script async src="https://telegram.org" data-telegram-post="empty0_0channel/3" data-width="100%" data-userpic="false" data-color="343638" data-dark="1" data-dark-color="FFFFFF"></script>
    </div>

    <!-- Новая версия для сброса кэша скриптов -->
    <script src="script.js?v=1115"></script>
</body>
</html>
